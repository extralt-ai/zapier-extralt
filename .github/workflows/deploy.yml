name: Deploy

# Pushing a tag such as v0.0.1 uploads that version to Zapier. It stays private until it is
# promoted, which is a manual step: `npx zapier-platform promote <version>`.
on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: deploy

jobs:
  push:
    name: Push to Zapier
    runs-on: ubuntu-latest
    environment: zapier
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npx zapier-platform push
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
